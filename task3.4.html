
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Example</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>My College Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Navigation Section -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <!-- Section -->
        <section>
            <h2>About My Course</h2>
            <p>I am pursuing B.Tech in Computer Science.</p>
        </section>

        <!-- Article -->
        <article>
            <h2>My Learning Journey</h2>
            <p>I am learning HTML, CSS, JavaScript and Java.</p>
        </article>

        <!-- Aside -->
        <aside>
            <h3>Related Information</h3>
            <p>Visit W3Schools to learn more about HTML.</p>
        </aside>

    </main>

    <!-- Footer Section -->
    <footer>
        <p>Copyright &copy; 2026 My College Website</p>
    </footer>

</body>
</html>

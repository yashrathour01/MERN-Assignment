
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Table</title>
</head>
<body>

    <h1>College Events Schedule</h1>

    <table border="1" cellpadding="10">

        <!-- Table Heading Row -->
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
        </thead>

        <!-- Table Body Rows -->
        <tbody>
            <tr>
                <td>101</td>
                <td>Tech Fest</td>
                <td>10 November 2026</td>
                <td>College Auditorium</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Sports Day</td>
                <td>15 November 2026</td>
                <td>College Ground</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Cultural Fest</td>
                <td>20 November 2026</td>
                <td>Main Campus</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Hackathon</td>
                <td>25 November 2026</td>
                <td>Computer Lab</td>
            </tr>
        </tbody>

        <!-- Table Footer Row -->
        <tfoot>
            <tr>
                <td colspan="4">
                    Total Events: 4
                </td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
